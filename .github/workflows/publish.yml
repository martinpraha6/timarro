name: Publish
on: workflow_dispatch # manual trigger only — nothing ships accidentally (§8)
permissions:
  contents: read
  id-token: write # npm provenance / trusted publishing
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: 'https://registry.npmjs.org'
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint && pnpm typecheck && pnpm test:coverage && pnpm build && pnpm size && pnpm check:bundle && pnpm check:package
      - run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }} # or remove once npm Trusted Publishing (OIDC) is configured for this workflow
